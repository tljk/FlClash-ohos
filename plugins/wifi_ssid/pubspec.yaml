name: wifi_ssid
description: "A Flutter plugin to retrieve the current WiFi SSID."
version: 0.0.1
homepage:

environment:
  sdk: '>=3.4.4 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.wifi_ssid
        pluginClass: WifiSsidPlugin
      macos:
        pluginClass: WifiSsidPlugin
      windows:
        pluginClass: WifiSsidPluginCApi
      linux:
        pluginClass: WifiSsidPlugin
      ohos:
        pluginClass: WifiSsidPlugin
