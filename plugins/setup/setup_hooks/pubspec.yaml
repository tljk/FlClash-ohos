name: setup_hooks
description: Build logic behind FlClash's setup build hook — compiles the Go core and Rust helper.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.10.0

dependencies:
  code_assets: ^1.2.1
  crypto: ^3.0.3
  hooks: ^2.2.0
  logging: ^1.2.0
  path: ^1.9.0
  yaml: ^3.1.2

dependency_overrides:
  code_assets:
    git:
      url: https://gitcode.com/CPF-Flutter/fluttertpc_dart_native.git
      path: pkgs/code_assets
      ref: flutter_3.47.7_deps

dev_dependencies:
  flutter_lints: ^6.0.0
  test: ^1.24.0
