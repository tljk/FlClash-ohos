name: fl_clash
description: A multi-platform proxy client based on ClashMeta, simple and easy to use, open-source and ad-free.
publish_to: 'none'
version: 0.8.99+2026110101
environment:
  sdk: '>=3.10.0 <4.0.0'

hooks:
  user_defines:
    setup:
      build_assets: true
    rust_api:
      build_assets: true
    sqlite3:
      source: sqlite3
      url_pattern: "https://github.com/tljk/sqlite3.dart/releases/download/$RELEASE_TAG/$FILENAME"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.4.0
  intl: any
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.5.3
  window:
    path: plugins/window
  dynamic_color: ^2.1.0
  proxy:
    path: plugins/proxy
  launch_at_startup:
    git:
      url: https://github.com/chen08209/launch_at_startup.git
      ref: e930ce65c5804343103447e01d39fccabedc8681
  json_annotation: ^4.12.0
  file_picker: ^12.0.0
  mobile_scanner: ^7.4.2
  app_links: ^7.1.2
  win32_registry: ^3.0.3
  tray:
    path: plugins/tray
  wifi_ssid:
    path: plugins/wifi_ssid
  collection: ^1.19.1
  animations: ^3.0.0
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  freezed_annotation: ^3.1.0
  image_picker: ^1.2.0
  ffi: ^2.1.4

  dio: ^5.8.0+1
  win32: ^6.4.0
  code_forge:
    path: plugins/code_forge
  re_highlight: ^0.0.3
  archive: ^4.0.7
  emoji_regex: ^0.0.5
  uni_platform: ^0.1.3
  device_info_plus: ^13.2.0
  connectivity_plus: 7.2.0
  screen_retriever: ^0.2.1
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.6
  riverpod: ^3.4.3
  material_color_utilities: ^0.13.0
  material_new_shapes: ^1.0.0
  flutter_svg: ^2.1.0
  path_parsing: ^1.1.0
  flutter_cache_manager: ^3.4.1
  crypto: ^3.0.3
  yaml: ^3.1.3
  yaml_writer:
    git:
      url: https://github.com/chen08209/yaml_writer
      ref: 79c78a44ec9c2f5f5f97da1a65610c6fb2ead8b3
  super_sliver_list: ^0.4.1
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  fractional_indexing: ^1.0.0
  navigator_resizable: ^3.1.0
  flutter_staggered_grid_view: ^0.7.0
  rust_api:
    path: plugins/rust_api
  setup:
    path: plugins/setup

dependency_overrides:
  sqlite3:
    git:
      url: https://github.com/tljk/sqlite3.dart
      path: sqlite3
      ref: main
  native_toolchain_rust:
    git:
      url: https://github.com/tljk/native_toolchain_rust.git
      path: native_toolchain_rust
      ref: main
  device_info_plus:
    git:
      url: https://github.com/tljk/plus_plugins.git
      path: packages/device_info_plus/device_info_plus
      ref: main
  package_info_plus:
    git:
      url: https://github.com/tljk/plus_plugins.git
      path: packages/package_info_plus/package_info_plus
      ref: main
  connectivity_plus:
    git:
      url: https://github.com/tljk/plus_plugins.git
      path: packages/connectivity_plus/connectivity_plus
      ref: main
  file_picker:
    git:
      url: https://github.com/tljk/flutter_file_picker.git
      ref: v12.0.0-fix-ohos
  android_file_picker:
    git:
      url: https://github.com/tljk/flutter_file_picker.git
      path: packages/file_picker_android
      ref: v12.0.0-fix-ohos
  file_picker_darwin:
    git:
      url: https://github.com/tljk/flutter_file_picker.git
      path: packages/file_picker_darwin
      ref: v12.0.0-fix-ohos
  file_picker_linux:
    git:
      url: https://github.com/tljk/flutter_file_picker.git
      path: packages/file_picker_linux
      ref: v12.0.0-fix-ohos
  file_picker_ohos:
    git:
      url: https://github.com/tljk/flutter_file_picker.git
      path: packages/file_picker_ohos
      ref: v12.0.0-fix-ohos
  windows_file_picker:
    git:
      url: https://github.com/tljk/flutter_file_picker.git
      path: packages/file_picker_windows
      ref: v12.0.0-fix-ohos
  file_picker_web:
    git:
      url: https://github.com/tljk/flutter_file_picker.git
      path: packages/file_picker_web
      ref: v12.0.0-fix-ohos
  file_picker_platform_interface:
    git:
      url: https://github.com/tljk/flutter_file_picker.git
      path: packages/file_picker_platform_interface
      ref: v12.0.0-fix-ohos
  mobile_scanner:
    git:
      url: https://github.com/tljk/mobile_scanner.git
      ref: v7.4.0-fix-ohos
  path_provider:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      path: packages/path_provider/path_provider
      ref: br_path_provider-v2.1.5_ohos
  url_launcher:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      path: packages/url_launcher/url_launcher
      ref: br_url_launcher-v6.3.2_ohos
  shared_preferences:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      path: packages/shared_preferences/shared_preferences
      ref: br_shared_preferences-v2.5.4_ohos
  shared_preferences_foundation:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      path: packages/shared_preferences/shared_preferences_foundation
      ref: br_shared_preferences-v2.5.4_ohos
  image_picker:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      path: packages/image_picker/image_picker
      ref: br_image_picker-v1.2.1_ohos
  app_links:
    git:
      url: https://gitcode.com/CPF-Flutter/fluttertpc_app_links.git
      ref: br_v7.0.0_ohos
      path: app_links
  dynamic_color:
    git:
      url: https://gitcode.com/CPF-Flutter/fluttertpc_dynamic_color.git
      path: packages/dynamic_color
      ref: dev
  code_assets:
    git:
      url: https://gitcode.com/CPF-Flutter/fluttertpc_dart_native.git
      path: pkgs/code_assets
      ref: flutter_3.47.7_deps
  native_toolchain_c:
    git:
      url: https://gitcode.com/CPF-Flutter/fluttertpc_dart_native.git
      path: pkgs/native_toolchain_c
      ref: flutter_3.47.7_deps
  material_ui:
    path: ../material_ui
  cupertino_ui:
    path: ../cupertino_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.14.1
  build_runner: ^2.15.1
  args: ^2.4.2
  freezed: ^4.0.1
  riverpod_generator: ^4.0.8

  drift_dev: ^2.34.0
  intl_utils: ^2.8.15
  test: ^1.31.0
  sqlite3: ^3.5.1
  cross_file: ^0.3.4+2
  mocktail: ^1.0.4
  path_provider_platform_interface: ^2.1.3

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/fonts/
    - assets/images/
    - assets/images/avatar/
    - assets/images/services/
    - path: assets/images/tray/unix/
      platforms: [ linux ]
    - path: assets/images/tray/macos/
      platforms: [ macos ]
    - path: assets/images/tray/windows/
      platforms: [ windows ]
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
    - family: Twemoji
      fonts:
        - asset: assets/fonts/Twemoji.Mozilla.ttf
flutter_intl:
  enabled: true
  class_name: AppLocalizations
  arb_dir: arb
  output_dir: lib/l10n
